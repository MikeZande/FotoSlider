<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="style.css" />
        <script src="slider.js" defer></script>
    </head>
    <body>
        <main class="comparison" style="--position: 50%">
            <!-- Images -->
            <img
                class="image"
                src="./images/watisdit.png"
                draggable="false"
            />
            <div class="top-image">
                <img
                    class="image"
                    src="./images/watisdit-mirrored.png"
                    draggable="false"
                />
            </div>

            <!-- Divider/Slider -->
            <div class="divider">
                <div class="handle">
                    <svg viewBox="0 0 24 24" focusable="false">
                        <path d="M8 5 3 12l5 7M16 5l5 7-5 7" />
                    </svg>
                </div>
            </div>

            <!-- Buttons -->
            <div class="buttons">
                <button type="button" class="photo-button" data-position="100">Photo A</button>
                <button type="button" class="photo-button" data-position="0">Photo B</button>
            </div>
        </main>
    </body>
</html>
